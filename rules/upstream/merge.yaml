# 上游合并模板
# 当前实现已经从“手工拷贝合并”切换为“手写规则 + INCLUDE 上游快照”。

defaults:
  dedupe: true
  keep_comments: false
  normalize:
    trim_whitespace: true
    drop_blank_lines: true
  output_policy:
    source_layer_only: true
    client_layer_via_dist: true
  sync_policy:
    fetch_to_rules_upstream: true
    source_files_use_include: true
    manual_entries_first: true

merge_plan:
  - id: adspower-direct
    target: rules/direct/adspower_direct.list
    purpose: AdsPower 代理检测与网络环境测试直连放行
    strategy:
      - generated_from_rules_app_adspower_manifest
      - keep_single_source_of_truth
    notes:
      - 统一由 rules/app/adspower.txt 维护，不直接手改该源文件
      - adspower.com 与 adspower.net 在主清单中必须成对出现

  - id: ai-cn-direct
    target: rules/direct/ai_cn_direct.list
    purpose: 国内 AI 平台显式直连入口
    strategy:
      - manual_only
      - explicit_official_domains_first_then_local_keyword_fallback
      - keep_scope_curated_and_aggressive
    notes:
      - 客户端顺序应放在 direct/bytedance_direct.list 与 direct/cn_direct.list 前
      - 海外 AI 继续交给 rules/region/us/ai_us.list；字节共享基础设施与中国大陆通用兜底继续交给 direct/bytedance_direct.list 与 direct/cn_direct.list

  - id: cn-direct
    target: rules/direct/cn_direct.list
    purpose: 中国大陆基础直连兜底，尽量避免国内站点误走代理
    strategy:
      - include_loyalsoldier_first_then_local_cn_fallback
      - include_loyalsoldier_direct_and_cncidr

  - id: os-time-direct
    target: rules/direct/os_time_direct.list
    purpose: 操作系统时间同步直连
    strategy:
      - manual_only
      - keep_scope_small_and_stable
      - match_only_official_time_hosts
    notes:
      - Windows 独立设备默认时间源使用 time.windows.com；域成员通常跟随域时间层级，这里不扩展到域控体系
      - Apple 官方示例与企业网络文档包含 time.apple.com 与 time-macos.apple.com；两者统一保留
      - 时间同步更依赖原生链路对称性，默认保持 DIRECT，不并入节点选择

  - id: apple-direct
    target: rules/direct/apple_direct.list
    purpose: Personal 激进配置的 Apple 全域名直连入口
    strategy:
      - manual_only
      - explicit_official_domain_families
      - no_apple_keyword_or_ip_bypass
    notes:
      - Personal 调用层必须放在 Apple 更新拒绝与 macOS 美国更新前，因此 Apple 更新也会直连
      - 不使用 17.0.0.0/8、Surge skip-proxy 或 DOMAIN-KEYWORD,apple，避免绕过规则层与误伤第三方同名站点

  - id: outlook-direct
    target: rules/direct/outlook_direct.list
    purpose: Personal 激进配置的 Outlook 邮箱数据面直连入口
    strategy:
      - manual_only
      - official_outlook_and_hotmail_domains
      - keep_shared_microsoft_auth_in_us_rules
    notes:
      - 放在 Microsoft Store 美国专项之后、通用 Microsoft 美国规则之前
      - 不把 live.com 与 microsoftonline.com 根域整体直连，避免共享登录链路改变 Store 出口

  - id: bilibili-direct
    target: rules/direct/bilibili_direct.list
    purpose: Bilibili 直连
    strategy:
      - include_upstream_first_then_local_domain_fallback
      - include_blackmatrix7_bilibili

  - id: bytedance-direct
    target: rules/direct/bytedance_direct.list
    purpose: 字节系直连
    strategy:
      - keep_source_file_as_include_entry
      - include_blackmatrix7_bytedance_and_douyin

  - id: netease-direct
    target: rules/direct/netease_direct.list
    purpose: 网易直连
    strategy:
      - include_upstream_first_then_local_domain_fallback
      - include_blackmatrix7_netease_music

  - id: alicloud-hk-ipv4-ssh22-direct
    target: rules/direct/alicloud_hk_ipv4_ssh22_direct.list
    purpose: 阿里云香港 IPv4 派生 SSH TCP/22 直连入口
    strategy:
      - keep_source_file_as_single_include
      - sync_alicloud_cn_hongkong_ipv4_daily_via_complete_stable_openapi_pagination
      - sync_alicloud_fallback_asns_via_ripestat_with_minimum_one_peer
      - keep_published_ipv4_coverage_monotonic_without_automatic_deletion
      - add_runtime_ip_asn_fallback_for_new_allocations_and_stale_remote_caches
      - derive_ssh_tcp_22_rules_from_official_bgp_and_history_union
    notes:
      - 地域精确数据源为阿里云官方 VPC OpenAPI DescribePublicIpAddress；官方明确说明它不能查询经典网络，因此不能单独视为阿里云公网全集
      - 原始条目累计达到 TotalCount 后才允许全局去重与发布，并记录重复条目与唯一地址覆盖量
      - 宽覆盖数据源为 RIPEstat 的阿里兜底 ASN 当前 BGP 公告；发布集合与历史文件做单调并集，上游撤回不触发自动删除
      - 静态累计 CIDR 后继续保留 AS45102、AS134963 与 AS24429 的运行时 TCP/22 兜底，用于承接静态同步间隙内出现的新切片
      - 公开入口直接保留 no-resolve 与 SSH TCP/22 最终语义，不要求客户端额外拼接端口条件
      - 首次同步需要具备该接口读取权限的 AccessKey 或 STS 临时凭证

  - id: github-ssh-direct
    target: rules/direct/github_ssh_direct.list
    purpose: GitHub 仓库 SSH 定向直连
    strategy:
      - manual_only
      - keep_scope_small_and_stable
      - match_only_github_ssh_endpoints
    notes:
      - 仅覆盖 github.com:22 与 ssh.github.com:443
      - 客户端顺序必须放在 proxy/gfw 前
  - id: hk-google
    target: rules/region/hk/google_hk.list
    purpose: Google / YouTube / Gemini / Google Cloud 地址空间统一走香港策略
    strategy:
      - include_upstream_first_then_local_keyword_fallback
      - include_blackmatrix7_google_fcm_youtube_and_gemini
      - include_complete_official_goog_json_ip_space
    notes:
      - Google 全业务规则只维护在 rules/region/hk/google_hk.list，不在 ai_us 或其他区域保留交叉兜底
      - 客户端必须把 google_hk 放在广告拒绝、ai_us、国内直连、海外 DNS IP 美国分流与所有广谱兜底之前
      - 官方 goog.json 地址空间动态变化；同步时拒绝空数据、重复前缀、非公网地址与异常 IP 版本
      - 为满足宁可过度覆盖也不遗漏，完整保留 Google Cloud 客户地址，允许第三方 GCP 服务走香港
      - Surge [Host] 与 Mihomo nameserver-policy 继续让 Google 目标域名使用海外加密 DNS，不得回落国内 DNS

  - id: us-microsoft
    target: rules/region/us/microsoft_us.list
    purpose: Microsoft / OneDrive 统一走美国策略
    strategy:
      - include_blackmatrix7_first_then_local_process_fallback
      - include_blackmatrix7_onedrive_and_microsoft
    notes:
      - Windows 更新禁用仍由 reject/os_update_reject 先拦截；放开拒绝入口后再由本文件接到美国策略
      - 不再放在 direct/ 下，避免 Microsoft 流量回落直连或被 cn_direct 宽泛兜底吞掉

  - id: us-microsoft-store
    target: rules/region/us/microsoft_store_us.list
    purpose: Personal 激进配置的 Microsoft Store 与下载基础设施统一走美国策略
    strategy:
      - manual_only
      - official_windows_store_and_delivery_optimization_endpoints
    notes:
      - Personal 调用层必须先于 outlook_direct 与 microsoft_us
      - 第三方发行商自托管安装包域名不属于 Microsoft 官方静态端点，不能承诺由本规则全集覆盖

  - id: us-macos-update
    target: rules/region/us/macos_update_us.list
    purpose: macOS 系统更新统一走美国策略
    strategy:
      - manual_only
      - keep_scope_small_and_stable
    notes:
      - 仅保留 Apple 官方标注为 macOS only 的系统更新主机，避免把 App Store / Apple TV 等其他 Apple 服务误并入
      - 设计为与 reject/os_update_reject 配套使用；需要升级 macOS 时，可临时注释对应 reject 入口后命中这里并走美国策略

  - id: hk-telegram
    target: rules/region/hk/telegram.list
    purpose: Telegram 走香港区域策略
    strategy:
      - include_upstream_first_then_local_domain_fallback
      - include_loyalsoldier_telegram_cidr
    notes:
      - 香港节点通常更稳定、速度更快，适合 Telegram 大流量场景
      - 香港地区内容生态与支付方式也更友好

  - id: hk-personal-priority
    target: rules/region/hk/personal_priority_hk.list
    purpose: Surge Personal 少量站点香港优先覆盖
    strategy:
      - manual_only
      - personal_profiles_only
    notes:
      - 必须放在广告拒绝与中国直连前
      - 不得接入 rulemesh-substore-surge-work-whitelist.conf

  - id: hk-notion
    target: rules/region/hk/notion_hk.list
    purpose: Notion 全域名统一走香港策略
    strategy:
      - official_domains_first
      - legacy_domain_then_brand_keyword_fallback
    notes:
      - notion 品牌关键词是用户批准的激进兜底

  - id: hk-alibaba
    target: rules/region/hk/alibaba_hk.list
    purpose: 阿里系业务按设备固定走香港区域策略
    strategy:
      - include_blackmatrix7_alibaba_and_xianyu
      - retain_aggressive_brand_keyword_fallback
      - bind_to_hk_auto_only_in_opt_in_client_rules
      - reuse_same_ruleset_for_surge_overseas_dns_override
    notes:
      - 默认公开模板不启用，客户端应在调用层限定设备或明确的专用配置，避免改变其他终端的国内业务路径
      - 客户端顺序必须放在 direct/ai_cn_direct、direct/cn_direct 与阿里云 SSH 指定直连入口前
      - Surge 的 [Host] 应在所用的 cn_dns_domains 或 cn_performance_dns_domains 前复用本规则集并优先绑定海外 DoH；Mihomo 使用已批准的对应 rule-set nameserver-policy 镜像默认海外 nameserver，并保持单一业务 DNS 真相
      - 闲鱼除 XianYu 上游外继续保留 goofish、xianyu 与 idlefish 关键词兜底，优先避免漏网

  - id: hk-wps-kdocs
    target: rules/region/hk/wps_kdocs.list
    purpose: WPS Office 与金山文档相关连接统一走香港策略
    strategy:
      - manual_only
      - explicit_official_domains_first_then_brand_keyword_fallback
      - bind_to_hk_auto
      - reuse_same_ruleset_for_surge_overseas_dns_override
    notes:
      - 客户端顺序必须放在 direct/cn_direct 与工作白名单 FINAL,REJECT 前，避免 WPS 专用域名被通用大陆直连或最终拒绝抢先命中
      - Surge 的 [Host] 应在所用的 cn_dns_domains 或 cn_performance_dns_domains 前复用本 RULE-SET 并优先绑定海外 DoH；Mihomo 使用已批准的对应 rule-set nameserver-policy 镜像默认海外 nameserver，并保持单一业务 DNS 真相
      - 不使用 DOMAIN-KEYWORD,wps，避免误伤 jwpsrv.com 等无关域名；ksyun.com 是为旧文件和对象存储完整性接受的共享基础设施边界

  - id: hk-brokers
    target: rules/region/hk/hk_brokers.list
    purpose: 复星证券、致富证券、辉立证券与富途走香港区域策略
    strategy:
      - manual_only
      - explicit_official_domains_first_then_aggressive_keyword_fallback
      - bind_to_hk_auto
    notes:
      - 只围绕这四家香港券商维护，不扩展到其他券商、交易所或通用金融站点
      - 客户端顺序应放在 region/hk/global_media 与 proxy/gfw 前，避免登录、开户、行情与交易接口被后续规则吞掉
      - 允许品牌词级别误伤，优先保证相关域名全部命中香港自动选择

  - id: hk-securities-aggressive
    target: rules/region/hk/hk_securities_aggressive.list
    purpose: Personal 激进配置的香港证券公司与老虎证券香港出口
    strategy:
      - include_hkex_sehk_participant_website_snapshot
      - explicit_tiger_brokers_domains_and_low_collision_keywords
      - include_tiger_marketing_compliance_and_static_infrastructure
      - reject_truncated_snapshot_updates
    notes:
      - 现有 hk_brokers 保持不变，避免间接扩张工作白名单
      - 不使用 tiger、broker、securities、capital 或 finance 等通用关键词

  - id: gfw-proxy
    target: rules/proxy/gfw.list
    purpose: GFW 代理兜底
    strategy:
      - include_upstream_first_then_local_core_fallback
      - include_loyalsoldier_gfw_and_tld_not_cn

  - id: adspower-proxy
    target: rules/proxy/adspower_proxy.list
    purpose: AdsPower 必须走节点选择的核心服务
    strategy:
      - generated_from_rules_app_adspower_manifest
      - keep_single_source_of_truth
    notes:
      - 统一由 rules/app/adspower.txt 维护，不直接手改该源文件
      - 规则顺序应先于 proxy/gfw，避免被广谱代理入口吞没

  - id: onepassword-proxy
    target: rules/proxy/onepassword_proxy.list
    purpose: 1Password 核心连接节点选择
    strategy:
      - keep_source_file_as_single_include
      - sync_onepassword_core_domains_daily_from_official_support
      - keep_only_first_party_core_domains_and_update_endpoints
    notes:
      - 只自动保留 1Password 官方自有核心域名与更新/基础设施端点
      - 不自动并入 Watchtower、Fastmail、Brex、Privacy Cards 等第三方依赖域名
      - 客户端顺序应放在 proxy/gfw 前；工作白名单中也应作为显式放行入口

  - id: github-core-proxy
    target: rules/proxy/github_core_proxy.list
    purpose: GitHub 网页、API、Gist、Raw 与静态资源节点选择入口
    strategy:
      - manual_only
      - keep_scope_small_and_stable
      - separate_git_transport_from_https_core_services
    notes:
      - Git 传输继续由 direct/github_ssh_direct 承接；本入口只处理核心 HTTPS 业务
      - 默认显式覆盖 github.com、githubassets.com 与 githubusercontent.com，不扩展到 github.io
      - 客户端顺序应放在 proxy/gfw 前；Surge 侧仍建议在它前面保留 raw.githubusercontent.com 自举入口

  - id: polygon-rpc-proxy
    target: rules/proxy/polygon_rpc_proxy.list
    purpose: Polygon 主网 RPC 域名专项节点选择
    strategy:
      - keep_source_file_as_single_include
      - sync_chainlist_polygon_rpc_hosts_daily
      - retain_incremental_union_without_shrinking_scope
    notes:
      - 每日抓取 chainlist.org/rpcs.json 中 chainId=137 的最终 RPC 列表，并统一归一化为主机名规则
      - 上游快照采用只增不减策略，避免 Chainlist 日常波动导致既有覆盖面回撤
      - 客户端顺序应放在 proxy/gfw 前，避免被广谱代理入口提前命中
  - id: bsc-rpc-proxy
    target: rules/proxy/bsc_rpc_proxy.list
    purpose: BSC 主网 RPC 域名专项节点选择
    strategy:
      - keep_source_file_as_single_include
      - sync_chainlist_bsc_rpc_hosts_daily
      - retain_incremental_union_without_shrinking_scope
    notes:
      - 每日抓取 chainlist.org/rpcs.json 中 chainId=56 的最终 RPC 列表，并统一归一化为主机名规则
      - 仅覆盖 BNB Smart Chain Mainnet，不扩展到 opBNB 等其他 BNB 系链
      - 客户端顺序应放在 proxy/gfw 前，避免被广谱代理入口提前命中

  - id: overseas-dns-ipv4-proxy
    target: rules/proxy/overseas_dns_ipv4_proxy.list
    purpose: 海外 DNS 主 IPv4 端点专项美国分流
    strategy:
      - manual_only
      - keep_scope_small_and_stable
      - match_exact_ipv4_endpoint_without_port_binding
    notes:
      - 当前精确匹配 1.1.1.1/32 与 9.9.9.9/32，不再绑定 53 端口，方便后续复用到其他端口探活
      - Google 8.8.8.8 已从本文件移除，由前置 rules/region/hk/google_hk.list 的官方完整地址空间固定走香港
      - 客户端顺序应放在 proxy/gfw 前，避免被广谱代理入口提前命中

  - id: hk-global-media
    target: rules/region/hk/global_media.list
    purpose: 国际流媒体走香港区域策略
    strategy:
      - include_upstream_first_then_local_core_fallback
      - include_blackmatrix7_global_media
    notes:
      - 香港节点通常更稳定、速度更快，适合 global media 场景
      - 香港地区内容更贴近华语用户，且支付方式更友好
      - Polymarket 当前在已接入上游里只有 gfw 通用后缀，本地在这里保留 DOMAIN-SUFFIX 与 DOMAIN-KEYWORD,polymarket 的香港兜底

  - id: us-ai
    target: rules/region/us/ai_us.list
    purpose: 海外 AI 平台走美国策略
    strategy:
      - include_upstream_first_then_local_keyword_fallback
      - include_blackmatrix7_openai_family
      - include_skywalkerji_coding_ai
      - include_accademia_grok
    notes:
      - 统一承接 OpenAI / Claude / Gemini / Copilot / Cursor / Grok / Windsurf / Augment 等海外 AI 平台
      - 客户端默认绑定美国地区策略，不再绑定台湾地区策略
      - Trae 只保留明确海外入口；DeepSeek、Trae 中国大陆入口与其他国内 AI 不并入该文件，而是优先交给 rules/direct/ai_cn_direct.list，再由直连兜底规则承接共享基础设施
      - 本地额外保留更激进的 DOMAIN-KEYWORD 兜底，用于覆盖新前端、新二级域名与第三方聚合入口

  - id: tw-crypto
    target: rules/region/tw/crypto_tw.list
    purpose: 加密货币相关网站走台湾策略
    strategy:
      - keep_single_entry_file_for_client_stability
      - include_upstream_first_then_local_category_fallback
      - include_blackmatrix7_cryptocurrency
    notes:
      - 覆盖区块浏览器、交易所、DeFi 与预测市场；本地保留第三方未覆盖站点，如 g42.ai

  - id: hk-aws-ipv4
    target: rules/region/hk/hk_aws_ipv4.list
    purpose: AWS 香港 IPv4 路由入口
    strategy:
      - keep_source_file_as_single_include
      - sync_aws_ap_east_1_ipv4_daily

  - id: aws-tokyo-ipv4
    target: rules/region/jp/tokyo_aws_ipv4.list
    purpose: AWS 东京 IPv4 路由入口
    strategy:
      - keep_source_file_as_single_include
      - sync_aws_ap_northeast_1_ipv4_daily

  - id: aws-osaka-ipv4
    target: rules/region/jp/osaka_aws_ipv4.list
    purpose: AWS 大阪 IPv4 路由入口
    strategy:
      - keep_source_file_as_single_include
      - sync_aws_ap_northeast_3_ipv4_daily

  - id: aws-seoul-ipv4
    target: rules/region/kr/seoul_aws_ipv4.list
    purpose: AWS 首尔 IPv4 路由入口
    strategy:
      - keep_source_file_as_single_include
      - sync_aws_ap_northeast_2_ipv4_daily

  - id: aws-taipei-ipv4
    target: rules/region/tw/taipei_aws_ipv4.list
    purpose: AWS 台北 IPv4 路由入口
    strategy:
      - keep_source_file_as_single_include
      - sync_aws_ap_east_2_ipv4_daily

  - id: jp-domains
    target: rules/region/jp/domains_to_jp.list
    purpose: 日本区域域名策略入口
    strategy:
      - manual_only
      - keep_scope_small_and_stable
    notes:
      - 当前保留 opinion.trade 显式入口，统一绑定日本地区策略
      - 只有确认存在稳定日本落点时再补充，避免把香港更稳定的解锁站点误挂到日本区域

  - id: multi-chain-socks5-ipcidr
    target: rules/region/multi/chain_socks5_ipcidr.list
    purpose: 私有链式 SOCKS5 端点池 CIDR 入口
    strategy:
      - manual_only
      - replace_from_private_provider_export
      - keep_only_valid_unique_public_ipv4_32
    notes:
      - 每次以私有服务商当前导出清单全量替换；公开仓库不得保存下载地址、端口或认证信息

  - id: reject-os-update
    target: rules/reject/os_update_reject.list
    purpose: 操作系统更新禁用（Windows + Apple）
    strategy:
      - manual_only
      - keep_scope_small_and_stable
    notes:
      - 不引入上游订阅，避免第三方规则膨胀或误伤非更新流量

  - id: reject-adspower
    target: rules/reject/adspower_reject.list
    purpose: AdsPower 隐私追踪与可安全阻断端点拦截
    strategy:
      - generated_from_rules_app_adspower_manifest
      - keep_single_source_of_truth
    notes:
      - 统一由 rules/app/adspower.txt 维护，不直接手改该源文件
      - 规则应与其他 reject 入口一起放在最前，先做阻断再做放行

  - id: adblock
    target: rules/reject/adblock_reject.list
    purpose: 轻量广告拦截
    strategy:
      - keep_small_and_readable
      - manual_only

  - id: cn-dns-domains
    target: rules/dns/cn_dns_domains.list
    purpose: 工作白名单等受控范围配置使用的小型中国 DNS 域名集合
    strategy:
      - manual_only
      - keep_small_and_curated
    notes:
      - 仅维护明确国内业务域名，不扩展为中国直连上游主体
      - 工作白名单继续使用本清单；性能配置另行使用 cn_performance_dns_domains

  - id: cn-performance-dns-domains
    target: rules/dns/cn_performance_dns_domains.list
    purpose: 性能配置使用的中国 DNS 域名集合
    strategy:
      - include_loyalsoldier_direct_then_curated_dns_domains
      - promote_upstream_plain_domains_to_dns_suffix
      - performance_config_only
    notes:
      - 合并 Loyalsoldier 中国直连域名主体与 cn_dns_domains 小型人工白名单，并保持首次出现顺序去重
      - 只供性能配置引用，不替代工作白名单继续使用的小型 cn_dns_domains 清单

runtime_plan:
  - id: shared-geoip-mmdb
    target: runtime/geodata/shared_country_mmdb
    purpose: Surge 与 Mihomo 共用的 GeoIP mmdb 上游来源
    strategy:
      - sync_selected_geodata_summary_to_rules_upstream_geodata
      - prefer_mihomo_official_default_provider_metacubex_meta_rules_dat
      - mirror_selected_country_mmdb_to_rulemesh_release_asset
      - pin_surge_geoip_maxmind_url_and_mihomo_geox_url_mmdb_to_same_country_mmdb
    notes:
      - 不把大体积 mmdb 二进制直接提交到本仓库，只登记上游选择与下载入口
      - 客户端统一引用本仓库 GitHub Release 镜像，不直接引用第三方仓库 release 链接
      - 如需切换来源，先更新 rules/upstream/geodata 快照、README、workflow 与两端模板，再同步本地私有 Surge / Mihomo 配置
